services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orderflow-db:/var/lib/postgresql/data

volumes:
  orderflow-db:
